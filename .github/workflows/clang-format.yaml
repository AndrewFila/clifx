name: Clang Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          find packets utils tests -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format --dry-run --Werror
